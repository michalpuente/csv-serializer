services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8091:5000"
    # host.docker.internal resolves to the host on Docker Desktop (macOS/Windows) and, via host-gateway, on Linux
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      ConnectionStrings__DefaultConnection: "Host=${DB_HOST:-host.docker.internal};Port=${DB_PORT:-5432};Database=${DB_NAME:-csv_serializer};Username=${DB_USER:-app};Password=${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}"
